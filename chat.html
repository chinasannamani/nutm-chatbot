<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUTM Assistant</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f0;color:#222}
    header{background:#fff;padding:16px 28px;border-bottom:4px solid #009f5d;display:flex;align-items:center;gap:20px}
    header img{height:64px}
    header h1{margin:0;font-size:22px}
    header p{margin:4px 0 0;color:#555;font-size:14px}
    main{max-width:720px;margin:30px auto;padding:0 20px;line-height:1.6}
    code{background:#fff;padding:2px 6px;border-radius:4px}
  </style>
</head>
<body>
  <header>
    <img src="/nutm_logo.png" alt="NUTM - In Africa, for Africa and the World">
    <div><h1>NUTM Assistant</h1><p>Ask me about programmes, fees and admission</p></div>
  </header>
  <main>
    <p>Ask the chat window about NUTM programmes, tuition fees, admission steps, entry requirements and contacts.</p>
    <p>Try: <code>How much is MSc Data Science?</code> <code>How do I apply for the MBA?</code>
       <code>What are the entry requirements for undergraduate?</code></p>
  </main>
  <script src="/widget.js" data-open="true"></script>
</body>
</html>
